# Variant 8: pure_mamba2
#
# Replaces MLA attention entirely with a Mamba-2 state-space mixer (arXiv:2405.21060), looped
# together with the same Kimi-K2-style sparse MoE feed-forward used throughout this project.
# No attention mechanism, no RoPE (Mamba-2's own sequential recurrence is position-sensitive
# without any explicit positional encoding). See docs/mamba_investigation.md for the full
# rationale, the WSL/CUDA-kernel install path, and the mamba_ssm dimension constraints this
# config satisfies (headdim=80 keeps (expand * hidden_size) // headdim == 16, a multiple of 8,
# as mamba_ssm's fused Triton kernels require).
#
# 93.6M params, effective_depth=26 (1 prefix + 6 loop-body * 4 loops + 1 suffix). Compare
# directly against configs/09_hybrid_mamba_mla.yaml (97.3M) and
# configs/10_mla_baseline_comparison.yaml (80.6M) -- same hidden_size/num_layers/num_loops/MoE
# config in all three, only the sequence mixer differs. Trimmed from an initial 640/2850-step
# pass (111.8M params) after the first real run's per-step cost on this GPU pushed the tqdm ETA
# to ~2.5hr; this version keeps the same architecture shape (num_layers/num_loops/MoE) and only
# reduces hidden_size and step count moderately, not either axis drastically.
model:
  vocab_size: 50257
  hidden_size: 576
  num_layers: 8
  num_heads: 8
  max_seq_len: 512
  dropout: 0.1
  position_encoding: none
  tie_word_embeddings: true
  seed: 1337
  attention:
    use_mla: false
  mixer_type: mamba2
  mamba:
    d_state: 64
    d_conv: 4
    expand: 2
    headdim: 72
    ngroups: 1
  moe:
    enabled: true
    num_routed_experts: 8
    num_shared_experts: 1
    top_k: 2
    expert_intermediate_size: 576
    bias_update_speed: 1.0e-3
    bias_update_speed_decay_frac: 0.1
  loop:
    enabled: true
    sharing_pattern: middle_cycle
    num_loops: 4
    num_unique_prefix_layers: 1
    num_unique_suffix_layers: 1
    use_iter_adaln: true
    use_active_ratio_balancing: true
    use_router_gating: false

train:
  train_bin_path: data/general_train.bin
  val_bin_path: data/general_val.bin
  output_dir: runs/08_pure_mamba2
  batch_size: 4
  gradient_accumulation_steps: 8
  max_steps: 2200
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  warmup_steps: 22
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip_norm: 1.0
  eval_interval: 55
  eval_iters: 30
  log_interval: 100
  checkpoint_interval: 55
  use_amp: true
  seed: 1337
  compile_model: false
