# Shared training hyperparameters, referenced (via anchor) or copy-pasted by each variant's
# train: block. Kept in sync manually since PyYAML anchors across separate files aren't native --
# each variant config below duplicates these values; change all five together if you tune this.
#
# Sized for a single RTX 4060 (8GB): batch_size=8 * grad_accum=4 = effective batch 32 sequences
# of 512 tokens = 16,384 tokens/optimizer-step. After vectorizing SparseMoE (see moe.py's
# BatchedExperts -- replaced a Python per-expert loop that bottlenecked on CPU kernel-launch
# overhead, not GPU compute), measured throughput at batch_size=8 is ~353ms/microbatch,
# ~6.5GB peak VRAM, ~11.6k tokens/sec, ~2hrs for a 5000-step run. Reduce batch_size first if you
# hit OOM (each -2 batch_size costs roughly -1.3GB peak VRAM at this model size).
train:
  batch_size: 4
  gradient_accumulation_steps: 8
  max_steps: 5000
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  warmup_steps: 200
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip_norm: 1.0
  eval_interval: 250
  eval_iters: 50
  log_interval: 20
  checkpoint_interval: 500
  use_amp: true
  seed: 1337
  compile_model: false
