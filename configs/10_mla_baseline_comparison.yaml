# Variant 10: mla_baseline_comparison
#
# The existing (pre-Mamba) looped-MoE-MLA architecture, at the SAME hidden_size/num_layers/
# num_loops/MoE configuration as configs/08_pure_mamba2.yaml and
# configs/09_hybrid_mamba_mla.yaml, so all three runs are a fair, matched three-way ablation
# differing only in sequence-mixing mechanism. This is not a new architecture -- it is
# configs/03_looped_moe_full.yaml's design rescaled to match the Mamba comparison's dimensions.
#
# 80.6M params, effective_depth=26. Compare against configs/08 (93.6M, Mamba-2 only) and
# configs/09 (97.3M, hybrid) -- MLA is cheaper here since it has no separate SSM parameters,
# so param-matching across all three exactly is not possible without changing MoE/hidden width
# per-variant; this baseline is intentionally left as this project's already-validated
# architecture rather than artificially inflated to match Mamba's parameter count. Trimmed
# alongside configs/08 and configs/09 (see configs/08's header for why) from an initial
# 640/2850-step pass.
model:
  vocab_size: 50257
  hidden_size: 576
  num_layers: 8
  num_heads: 8
  max_seq_len: 512
  dropout: 0.1
  position_encoding: decoupled_rope
  tie_word_embeddings: true
  seed: 1337
  attention:
    use_mla: true
    kv_compression_dim: 64
    q_compression_dim: 160
    rope_head_dim: 32
  mixer_type: attention
  moe:
    enabled: true
    num_routed_experts: 8
    num_shared_experts: 1
    top_k: 2
    expert_intermediate_size: 576
    bias_update_speed: 1.0e-3
    bias_update_speed_decay_frac: 0.1
  loop:
    enabled: true
    sharing_pattern: middle_cycle
    num_loops: 4
    num_unique_prefix_layers: 1
    num_unique_suffix_layers: 1
    use_iter_adaln: true
    use_active_ratio_balancing: true
    use_router_gating: false

train:
  train_bin_path: data/general_train.bin
  val_bin_path: data/general_val.bin
  output_dir: runs/10_mla_baseline_comparison
  batch_size: 4
  gradient_accumulation_steps: 8
  max_steps: 2200
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  warmup_steps: 22
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip_norm: 1.0
  eval_interval: 55
  eval_iters: 30
  log_interval: 100
  checkpoint_interval: 55
  use_amp: true
  seed: 1337
  compile_model: true
