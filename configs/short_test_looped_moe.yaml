# Short GPU stability test: variant 03 (looped_moe_full) architecture, 200 steps, on the
# smoke-test TinyStories slice (data/smoke/). Purpose: confirm real GPU stability (no OOM,
# no NaNs, reasonable step time/thermals) before committing to the full 5000-step run on the
# full corpus. Same architecture as configs/03_looped_moe_full.yaml.
model:
  vocab_size: 50257
  hidden_size: 768
  num_layers: 6
  num_heads: 12
  max_seq_len: 512
  dropout: 0.1
  position_encoding: decoupled_rope
  tie_word_embeddings: true
  seed: 1337
  attention:
    use_mla: true
    kv_compression_dim: 64
    q_compression_dim: 160
    rope_head_dim: 32
  moe:
    enabled: true
    num_routed_experts: 8
    num_shared_experts: 1
    top_k: 2
    expert_intermediate_size: 512
    bias_update_speed: 1.0e-3
    bias_update_speed_decay_frac: 0.1
  loop:
    enabled: true
    sharing_pattern: middle_cycle
    num_loops: 2
    num_unique_prefix_layers: 1
    num_unique_suffix_layers: 1
    use_iter_adaln: true
    use_active_ratio_balancing: true
    use_router_gating: false

train:
  train_bin_path: data/smoke/train.bin
  val_bin_path: data/smoke/val.bin
  output_dir: runs/short_test_looped_moe
  batch_size: 4
  gradient_accumulation_steps: 8
  max_steps: 200
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  warmup_steps: 20
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip_norm: 1.0
  eval_interval: 50
  eval_iters: 20
  log_interval: 10
  checkpoint_interval: 100
  use_amp: true
  seed: 1337
  compile_model: false
