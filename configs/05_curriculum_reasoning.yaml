# Variant 5: curriculum_reasoning
#
# ~97.5M param router-gated (per-token adaptive loop depth) looped-MoE model, trained on a
# two-phase curriculum: general English (FineWeb-Edu) for the first 25% of training, with
# math-reasoning data (OpenMathInstruct-2) ramping in linearly from 25%-45% of training and
# then holding at equal weight with general for the rest of the run. General never fades out,
# avoiding the capability-collapse risk of a pure-math cold start (see conversation discussion).
#
# Architecture: SharingPattern.FULL_LOOP (required for router-gating) with num_loops=3 -- the
# per-token router (docs/adaptive_depth_router_design.md) decides how many of those 3 passes
# each token actually needs, rather than every token getting a fixed depth. This is the
# genuinely novel combination flagged in docs/literature_survey.md (MoE + adaptive depth
# together) that no prior published work has tested, now exercised at real (if modest) scale.
#
# Token budget: deliberately below Chinchilla-optimal for 97.5M (needs ~1.95B tokens at 20x;
# this run uses the 1.695B tokens already downloaded, ~13.6 tokens/param, ~68% of optimal) --
# a deliberate choice to reuse existing data rather than download more, not an oversight.
#
# Measured on this project's RTX 4060: ~309ms/microbatch at batch_size=8, ~5.8GB peak VRAM,
# ~13.2k tokens/sec, ~35.6 hours (~1.5 days) total for 103,454 steps.
#
# RESCALED FOR H100 SXM (80GB) -- see docs/runpod_h100_setup.md and scripts/profile_batch_size.py.
# Empirical sweep on the actual H100 found throughput plateaus around batch_size=64: bs=96 was
# a real regression (278.5k tok/s, WORSE than bs=64's 299.0k) and bs=128 only edged out bs=64 by
# ~2% (305.3k tok/s) while using ~2x the VRAM (58.6GB vs 30.0GB) -- not worth the reduced safety
# margin on an unattended run given the ~2% gain is within likely measurement noise (the sweep's
# own torch.compile cache behavior was inconsistent across candidates: bs=64 recompiled in 0.4s,
# bs=96/128 took 27-30s, suggesting cache-state differences confound a clean comparison at the
# high end). Chose batch_size=64, grad_accum=1 (effective batch 64, double the original 32) for
# the best throughput-per-VRAM tradeoff: ~109.6ms/microbatch, ~299k tokens/sec, ~30GB peak
# (real training will use somewhat more via dataloader buffers -- 30GB leaves 50GB of headroom
# on an 80GB card, vs. bs=128's 58.6GB leaving only ~21GB). Effective batch doubling from 32->64
# also means max_steps roughly halves (103454->51727) for the same 1.695B-token budget, and
# learning_rate/min_learning_rate were scaled by sqrt(64/32)=1.414 per standard AdamW batch-size
# scaling practice (3.0e-4 -> 4.24e-4). warmup_steps/eval_interval/checkpoint_interval and the
# curriculum's start_step/ramp_steps were all rescaled proportionally to the new max_steps --
# see the values below, not the comment in the (now superseded) 4060 estimate above.
# Estimated H100 total training time: ~1.57 hours (94 min) for the full 51,727-step run.
model:
  vocab_size: 50257
  hidden_size: 1024
  num_layers: 3
  num_heads: 16
  max_seq_len: 512
  dropout: 0.1
  position_encoding: decoupled_rope
  tie_word_embeddings: true
  seed: 1337
  attention:
    use_mla: true
    kv_compression_dim: 72
    q_compression_dim: 216
    rope_head_dim: 32
  moe:
    enabled: true
    num_routed_experts: 8
    num_shared_experts: 1
    top_k: 2
    expert_intermediate_size: 768
    bias_update_speed: 1.0e-3
    bias_update_speed_decay_frac: 0.1
  loop:
    enabled: true
    sharing_pattern: full_loop
    num_loops: 3
    num_unique_prefix_layers: 1
    num_unique_suffix_layers: 1
    use_iter_adaln: true
    use_active_ratio_balancing: true
    use_router_gating: true
    router:
      capacity_ratio: 0.6
      min_loops: 1
      aux_loss_weight: 0.01

train:
  train_bin_path: data/general_train.bin  # unused (curriculum overrides), kept as a valid placeholder
  val_bin_path: data/general_val.bin      # unused (curriculum overrides), kept as a valid placeholder
  output_dir: runs/05_curriculum_reasoning
  curriculum:
    - name: general
      train_bin_path: data/general_train.bin
      val_bin_path: data/general_val.bin
      start_step: 0
      target_weight: 1.0
      # No end_step: general never fades out, so the model keeps seeing general text for the
      # entire run even after math ramps in (avoids the pure-math capability-collapse risk).
    - name: math
      train_bin_path: data/math_train.bin
      val_bin_path: data/math_val.bin
      start_step: 12932   # 25% of max_steps (51727)
      ramp_steps: 10345   # 20% of max_steps -- math reaches full weight at step 23277 (45%)
      target_weight: 1.0  # equal weight with general once fully ramped in (50/50 blend)
  batch_size: 64
  gradient_accumulation_steps: 1
  max_steps: 51727
  learning_rate: 4.24e-4
  min_learning_rate: 4.24e-5
  warmup_steps: 517
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip_norm: 1.0
  eval_interval: 1293
  eval_iters: 50
  log_interval: 2000
  checkpoint_interval: 1293
  use_amp: true
  seed: 1337
  # Verified working (correct training dynamics, genuine per-token router variation preserved,
  # checkpoints save/load correctly) at this exact architecture, on both the RTX 4060 (bs=8) and
  # H100 SXM (bs=64, via scripts/profile_batch_size.py -- see the RESCALED comment above). Combined
  # with fused AdamW (Trainer._build_optimizer applies this automatically on CUDA). One-time
  # compile cost (~20-30s on H100 at bs=64, per the profiling sweep) is negligible against the
  # full run length.
  compile_model: true
