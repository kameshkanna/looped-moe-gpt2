[project]
name = "looped-moe-gpt2"
version = "0.1.0"
description = "GPT-2-scale looped (recurrent-depth) transformer with Kimi-K2-style sparse MoE and Multi-head Latent Attention."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "tqdm>=4.66",
    "tiktoken>=0.7",
    "pyyaml>=6.0",
    "datasets>=2.19",
    "wandb>=0.17; extra == 'logging'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
